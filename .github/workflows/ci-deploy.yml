name: Check and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Queue releases. Cancelling a run while a migration is applying can leave the
# database and Workers on different revisions.
concurrency:
  group: visita-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app_checks:
    name: App tests and type checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck

  database_checks:
    name: Migration and RLS checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3.0.1
        with:
          version: latest
      - name: Apply migrations to a local database
        run: supabase start
      - name: Run RLS smoke tests
        run: docker exec -i supabase_db_visita psql -U postgres -d postgres -q -t -f - < supabase/scripts/rls_smoke.sql
      - name: Stop local Supabase
        if: always()
        run: supabase stop

  release:
    name: Migrate and deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [app_checks, database_checks]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check release configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN secret'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'Missing SUPABASE_DB_PASSWORD secret'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID secret'; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo 'Missing SUPABASE_PROJECT_REF variable'; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo 'Missing SUPABASE_PUBLISHABLE_KEY variable'; exit 1; }
          expected="\"SUPABASE_URL\": \"https://${SUPABASE_PROJECT_REF}.supabase.co\""
          grep -Fq "$expected" apps/consumer/wrangler.jsonc || { echo 'Consumer Worker targets a different Supabase project'; exit 1; }
          grep -Fq "$expected" apps/admin/wrangler.jsonc || { echo 'Admin Worker targets a different Supabase project'; exit 1; }
          expected="\"SUPABASE_PUBLISHABLE_KEY\": \"${SUPABASE_PUBLISHABLE_KEY}\""
          grep -Fq "$expected" apps/admin/wrangler.jsonc || { echo 'Admin Worker publishable key differs from the GitHub variable'; exit 1; }
      - name: Build consumer Worker
        env:
          PUBLIC_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm --filter @visita/consumer build
      - name: Build admin Worker
        env:
          VITE_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm --filter @visita/admin build
      - uses: supabase/setup-cli@v3.0.1
        with:
          version: latest
      - name: Link hosted project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Preview pending migrations
        run: supabase db push --dry-run
      - name: Apply pending migrations
        run: supabase db push
      - name: Deploy consumer Worker
        run: pnpm --filter @visita/consumer exec wrangler deploy
      - name: Deploy admin Worker
        run: pnpm --filter @visita/admin exec wrangler deploy
